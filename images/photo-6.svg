<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="hsl(375,78%,33%)"/>
    <stop offset="0.52" stop-color="hsl(403,70%,22%)"/>
    <stop offset="1" stop-color="hsl(430,62%,11%)"/>
  </linearGradient>
  <radialGradient id="r" cx="50%" cy="35%" r="70%">
    <stop offset="0" stop-color="white" stop-opacity=".28"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#g)"/>
<circle cx="875" cy="240" r="180" fill="#fff" opacity=".08" filter="url(#blur)"/>
<circle cx="500" cy="720" r="240" fill="#ff8ac5" opacity=".11" filter="url(#blur)"/>
<rect width="1200" height="900" fill="url(#r)"/>
<text x="70" y="700" fill="white" opacity=".92" font-family="Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="6">MORE TO COME</text>
<text x="70" y="775" fill="white" opacity=".58" font-family="Arial, sans-serif" font-size="27" letter-spacing="2">Replace me with your photo</text>
</svg>